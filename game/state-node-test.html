<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>StateNode Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #222;
            color: #eee;
        }

        .pass {
            color: #4f4;
        }

        .fail {
            color: #f44;
        }
    </style>
</head>

<body>
    <h1>StateNode Tests</h1>
    <div id="output"></div>
    <script type="module">
        import { StateNode } from './state-node.js';

        const out = document.getElementById('output');
        function log(msg, isPass) {
            const div = document.createElement('div');
            div.textContent = (isPass ? '[PASS] ' : '[FAIL] ') + msg;
            div.className = isPass ? 'pass' : 'fail';
            out.appendChild(div);
        }

        function assertDeepEqual(actual, expected, desc) {
            const jA = JSON.stringify(actual);
            const jE = JSON.stringify(expected);
            if (jA === jE) {
                log(desc, true);
            } else {
                log(`${desc} - Expected: ${jE}, Got: ${jA}`, false);
            }
        }

        // Test based on the comment in getAsObject
        // "if the node has keys "players.p1.score", "players.p2.score", and "round", 
        // then getAsObject("players") would return: { p1 { score: ... }, p2: { score: ... } }"
        try {
            const node = new StateNode(null, null);
            node.set('players.p1.score', 100);
            node.set('players.p2.score', 200);
            node.set('round', 5);

            const result = node.getAsObject('players');

            console.log('Deserialized players object:', result);

            assertDeepEqual(result, {
                p1: { score: 100 },
                p2: { score: 200 }
            }, 'Deserialization of players object');

            // Test setFromObject
            const node2 = new StateNode(null, null);
            node2.set('config.volume', 50);

            // Should update volume and add graphics.quality
            node2.setFromObject('config', { volume: 100, graphics: { quality: 'high' } });

            assertDeepEqual(node2.get('config.volume'), 100, 'setFromObject updates existing value');
            assertDeepEqual(node2.get('config.graphics.quality'), 'high', 'setFromObject adds nested value');

        } catch (e) {
            log('Exception: ' + e.message, false);
        }
    </script>
</body>

</html>
